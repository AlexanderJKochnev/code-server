services:
  android-ide:
    build: .
    container_name: android-ide
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:8443:8080"
    environment:
      - PASSWORD=${IDE_PASSWORD}
      - ANDROID_HOME=/home/coder/Android/Sdk
    volumes:
      - ./projects:/home/coder/projects
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/gradle-cache:/home/coder/.gradle
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/android-sdk:/home/coder/Android/Sdk
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/code-config:/home/coder/.local/share/code-server
    networks:
      nginx_gateway_shared_network:

  # Опционально: эмулятор Android с доступом через браузер (scrcpy-web)
  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    container_name: android-emulator
    restart: unless-stopped
    privileged: true
    shm_size: '2gb'
    devices:
      - "/dev/kvm:/dev/kvm"
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
      - EMULATOR_ADDITIONAL_ARGS=-no-accel -gpu swiftshader_indirect -no-snapshot -cores 2 -memory 2048
    volumes:
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/emulator-data:/home/androidusr/.android
    networks:
      - nginx_gateway_shared_network

networks:
  nginx_gateway_shared_network:
    driver: bridge
    external: true