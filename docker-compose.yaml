services:
  android-ide:
    build: .
    container_name: android-ide
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:8443:8080"
    environment:
      - PASSWORD=${PWD}
      - ANDROID_HOME=/home/coder/Android/Sdk
    volumes:
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/projects:/home/coder/projects
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/gradle-cache:/home/coder/.gradle
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/android-sdk:/home/coder/Android/Sdk
      - ${BIND_VOLUMES}/${COMPOSE_PROJECT_NAME}/code-config:/home/coder/.local/share/code-server
    networks:
      nginx_gateway_shared_network:

  # Опционально: эмулятор Android с доступом через браузер (scrcpy-web)
  android-emulator:
    image: shmayro/dockerify-android:latest
    container_name: android-emulator
    restart: unless-stopped
    devices:
      - "/dev/kvm:/dev/kvm"
    # ports:
    #   - "127.0.0.1:8000:8000" # Веб-интерфейс экрана (scrcpy-web)
    #   - "127.0.0.1:5555:5555" # ADB порт
    environment:
      - RAM_SIZE=4096
      - SCREEN_RESOLUTION=1080x2400
    profiles:
      - emulator
    networks:
      nginx_gateway_shared_network:

networks:
  nginx_gateway_shared_network:
    driver: bridge
    external: true